<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assets do truco</title>
<style>
  :root {
    --bg: #17120e; --panel: #221a14; --line: #3a2d22; --text: #f1e6d6; --muted: #b29e86;
    --accent: #e3a04a; --ok: #7cc47f; --bad: #e4675a; --warn: #e8c45a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 12px; }
  button, select { background: #2e241b; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  canvas, img.px { image-rendering: pixelated; image-rendering: crisp-edges; }
  #scene-wrap { overflow: auto; max-width: 100%; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cand { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .cand.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .cand.rejected { opacity: .55; }
  .stage { display: flex; align-items: center; justify-content: center; min-height: 200px; border-radius: 6px; overflow: auto; }
  .bg-checker { background: repeating-conic-gradient(#6b6b6b 0 25%, #8a8a8a 0 50%) 0 0 / 16px 16px; }
  .bg-dark { background: #0d0a08; } .bg-light { background: #efe7da; } .bg-magenta { background: #ff00ff; }
  .issues { font-size: 12px; margin: 0; padding-left: 16px; }
  .issues .e { color: var(--bad); } .issues .w { color: var(--warn); }
  details { font-size: 12px; } details pre { white-space: pre-wrap; word-break: break-word; background: #120d0a; padding: 8px; border-radius: 6px; max-height: 280px; overflow: auto; }
  textarea { width: 100%; min-height: 48px; background: #120d0a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .notice { border-left: 3px solid var(--accent); padding: 8px 12px; background: #2a2018; border-radius: 4px; }
  table { border-collapse: collapse; font-size: 12px; } td, th { padding: 2px 8px; border-bottom: 1px solid var(--line); text-align: left; }
</style>
</head>
<body>
<header>
  <h1>Assets do truco · validação</h1>
  <span id="approval" class="pill">carregando…</span>
  <span class="muted">Fundo:</span>
  <div class="row" id="bg-buttons"></div>
  <span class="muted">Zoom:</span>
  <select id="zoom"><option>2</option><option>4</option><option selected>6</option><option>8</option></select>
</header>
<main>
  <section>
    <div class="notice">Selecionar ou reprovar aqui só registra a revisão. Abrir esta página não aprova nada:
      a aprovação do estilo acontece com <code>python generate.py approve</code>, depois do seu ok explícito.</div>
  </section>
  <section>
    <h2>Cena de demonstração</h2>
    <p class="muted" id="scene-note"></p>
    <div id="scene-wrap"><canvas id="scene"></canvas></div>
  </section>
  <section id="report-section" hidden>
    <h2>Relatório técnico</h2>
    <div id="report"></div>
  </section>
  <div id="assets"></div>
</main>
<script>
const BGS = { checker: 'xadrez', dark: 'escuro', light: 'claro', magenta: 'magenta' };
let bg = localGet('bg', 'checker');
let zoom = Number(localGet('zoom', 6));
let data = null;
const imgCache = new Map();

function localGet(k, d) { try { return localStorage.getItem('assetgen.' + k) ?? d; } catch { return d; } }
function localSet(k, v) { try { localStorage.setItem('assetgen.' + k, v); } catch {} }
const file = p => p ? '/files/' + p : null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function loadImg(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise((ok, fail) => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src;
  }));
  return imgCache.get(src);
}

async function refresh() {
  data = await (await fetch('/api/state')).json();
  renderHeader(); renderReport(); renderAssets(); await renderScene();
}

function renderHeader() {
  const el = document.getElementById('approval');
  if (data.approval) { el.className = 'pill ok'; el.textContent = 'estilo aprovado em ' + new Date(data.approval.at * 1000).toLocaleString('pt-BR'); }
  else { el.className = 'pill warn'; el.textContent = 'aguardando aprovação'; }
  const wrap = document.getElementById('bg-buttons'); wrap.innerHTML = '';
  for (const [k, label] of Object.entries(BGS)) {
    const b = document.createElement('button'); b.textContent = label; if (k === bg) b.className = 'on';
    b.onclick = () => { bg = k; localSet('bg', k); renderHeader(); renderAssets(); }; wrap.append(b);
  }
  document.getElementById('zoom').value = String(zoom);
}

function renderReport() {
  const r = data.report; const sec = document.getElementById('report-section');
  if (!r) { sec.hidden = true; return; }
  sec.hidden = false;
  const rows = Object.entries(r.per_asset || {}).map(([id, s]) =>
    `<tr><td>${esc(id)}</td><td>${s.attempts}</td><td>${s.seconds}s</td><td>${s.validated ?? ''}</td></tr>`).join('');
  document.getElementById('report').innerHTML = `
    <p class="muted">Execução de ${esc(r.finished_at)} · ${r.generated} imagens geradas · ${r.validated} válidas ·
      ${r.failed} falharam · ${r.retries} retries · ${r.seconds}s no total · pico de VRAM ${esc(r.vram_peak_mib ?? 'n/d')} MiB</p>
    <table><tr><th>asset</th><th>tentativas</th><th>tempo</th><th>válidos</th></tr>${rows}</table>
    <details><summary>Modelo e configuração</summary><pre>${esc(JSON.stringify(r.environment, null, 2))}</pre></details>`;
}

function chosenCandidate(asset) {
  const id = asset.review.selected ?? asset.chosen?.candidate_id;
  return asset.candidates.find(c => c.id === id);
}

async function renderScene() {
  const layout = data.scene_layout; if (!layout) return;
  const byId = Object.fromEntries(data.assets.map(a => [a.id, a]));
  const sprites = {}; const notes = [];
  for (const id of new Set([layout.floor, ...layout.objects.map(o => o.asset)])) {
    const a = byId[id]; const c = a && chosenCandidate(a);
    if (!c?.sprite) { notes.push(`${id}: sem candidato válido`); continue; }
    sprites[id] = await loadImg(file(c.sprite));
    notes.push(`${id}: #${c.id} (${a.review.selected === c.id ? 'selecionado' : 'automático'})`);
  }
  document.getElementById('scene-note').textContent = notes.join(' · ');
  const cv = document.getElementById('scene');
  cv.width = layout.width; cv.height = layout.height;
  cv.style.width = layout.width * zoom + 'px'; cv.style.height = layout.height * zoom + 'px';
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#18100c'; ctx.fillRect(0, 0, cv.width, cv.height);
  const floor = sprites[layout.floor];
  if (floor) for (let y = 0; y < cv.height; y += floor.height) for (let x = 0; x < cv.width; x += floor.width) ctx.drawImage(floor, x, y);
  for (const o of [...layout.objects].sort((p, q) => p.y - q.y)) {
    const s = sprites[o.asset]; if (!s) continue;
    const x = o.x - Math.floor(s.width / 2), y = o.y - s.height;
    if (o.flip) { ctx.save(); ctx.translate(x + s.width, y); ctx.scale(-1, 1); ctx.drawImage(s, 0, 0); ctx.restore(); }
    else ctx.drawImage(s, x, y);
  }
}

function renderAssets() {
  const root = document.getElementById('assets'); root.innerHTML = '';
  for (const a of data.assets) {
    const sec = document.createElement('section');
    const size = a.target_size ? `${a.target_size.width}×${a.target_size.height}` : '';
    sec.innerHTML = `<h2>${esc(a.name)} <span class="pill ${a.status === 'failed' ? 'bad' : a.status === 'validated' || a.status === 'approved' ? 'ok' : ''}">${esc(a.status)}</span></h2>
      <p class="muted">${esc(a.id)} · ${esc(a.category)} · ${esc(a.kind)} · ${size} px · perfil ${esc(a.style)}<br>${esc(a.description)}</p>
      <div class="grid"></div>`;
    const grid = sec.querySelector('.grid');
    for (const c of [...a.candidates].reverse()) grid.append(candidateCard(a, c));
    root.append(sec);
  }
}

function candidateCard(a, c) {
  const el = document.createElement('div');
  const selected = a.review.selected === c.id, rejected = a.review.rejected.includes(c.id);
  el.className = 'cand' + (selected ? ' selected' : '') + (rejected ? ' rejected' : '');
  const w = a.target_size?.width ?? 32, h = a.target_size?.height ?? 32;
  const img = c.sprite ? `<img class="px" src="${file(c.sprite)}" width="${w * zoom}" height="${h * zoom}" alt="">` : `<span class="muted">sem sprite</span>`;
  const issues = [...(c.qc.errors || []).map(e => `<li class="e">${esc(e)}</li>`), ...(c.qc.warnings || []).map(e => `<li class="w">${esc(e)}</li>`)];
  if (c.error && !(c.qc.errors || []).length) issues.push(`<li class="e">${esc(c.error)}</li>`);
  const notes = a.review.notes.filter(n => n.candidate_id === c.id).map(n => `<li>${esc(n.note)}</li>`).join('');
  el.innerHTML = `
    <div class="row"><strong>#${c.id}</strong><span class="pill ${c.status === 'validated' ? 'ok' : c.status === 'failed' ? 'bad' : ''}">${esc(c.status)}</span>
      <span class="muted">rodada ${c.round} · slot ${c.slot} · tentativa ${c.attempt}</span>${selected ? '<span class="pill ok">selecionado</span>' : ''}</div>
    <div class="stage bg-${bg}">${img}</div>
    ${issues.length ? `<ul class="issues">${issues.join('')}</ul>` : ''}
    <div class="row">
      <button data-d="selected">Selecionar</button><button data-d="rejected">Reprovar</button><button data-d="cleared">Limpar</button>
      ${c.raw ? `<a href="${file(c.raw)}" target="_blank"><button>bruto 1024</button></a>` : ''}
      ${c.tiled ? `<a href="${file(c.tiled)}" target="_blank"><button>repetição 5×5</button></a>` : ''}
    </div>
    ${c.tiled ? `<div class="stage bg-dark"><img class="px" src="${file(c.tiled)}" width="${w * 5 * 2}" alt=""></div>` : ''}
    <textarea placeholder="Observação sobre este candidato"></textarea>
    <div class="row"><button data-d="note">Salvar observação</button></div>
    ${notes ? `<ul class="issues">${notes}</ul>` : ''}
    <details><summary>Metadados</summary><pre>${esc(JSON.stringify({ seed: c.seed, qc: c.qc, ...c.meta }, null, 2))}</pre></details>`;
  el.querySelectorAll('button[data-d]').forEach(b => b.onclick = async () => {
    const note = el.querySelector('textarea').value;
    if (b.dataset.d === 'note' && !note.trim()) return;
    await fetch('/api/review', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ asset_id: a.id, candidate_id: c.id, decision: b.dataset.d, note }) });
    refresh();
  });
  return el;
}

document.getElementById('zoom').onchange = e => { zoom = Number(e.target.value); localSet('zoom', zoom); renderAssets(); renderScene(); };
refresh();
</script>
</body>
</html>
