# Every weight the pipeline loads. Licenses were checked on the model cards
# (2026-10-30); all of them allow commercial use of the generated images.
# fetch_models.py writes the resolved sha256 of each file to models.lock.json.
weights:
  sdxl_base:
    repo: stabilityai/stable-diffusion-xl-base-1.0
    file: sd_xl_base_1.0.safetensors
    folder: checkpoints
    name: sd_xl_base_1.0.safetensors
    license: CreativeML OpenRAIL++-M
  sdxl_vae_fp16:
    repo: madebyollin/sdxl-vae-fp16-fix
    file: sdxl_vae.safetensors
    folder: vae
    name: sdxl_vae_fp16_fix.safetensors
    license: MIT
  pixel_art_lora:
    repo: nerijs/pixel-art-xl
    file: pixel-art-xl.safetensors
    folder: loras
    name: pixel-art-xl.safetensors
    license: CreativeML OpenRAIL-M
  lcm_lora:
    repo: latent-consistency/lcm-lora-sdxl
    file: pytorch_lora_weights.safetensors
    folder: loras
    name: lcm-lora-sdxl.safetensors
    license: CreativeML OpenRAIL++-M
  ipadapter_plus:
    repo: h94/IP-Adapter
    file: sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
    folder: ipadapter
    name: ip-adapter-plus_sdxl_vit-h.safetensors
    license: Apache-2.0
  clip_vision_h:
    repo: h94/IP-Adapter
    file: models/image_encoder/model.safetensors
    folder: clip_vision
    name: CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
    license: Apache-2.0
  layerdiffuse_attn:
    repo: LayerDiffusion/layerdiffusion-v1
    file: layer_xl_transparent_attn.safetensors
    folder: layer_model
    name: layer_xl_transparent_attn.safetensors
    license: CreativeML OpenRAIL-M
  layerdiffuse_decoder:
    repo: LayerDiffusion/layerdiffusion-v1
    file: vae_transparent_decoder.safetensors
    folder: layer_model
    name: vae_transparent_decoder.safetensors
    license: CreativeML OpenRAIL-M
