# Voice cast. The identity comes from the reference recording in references/<id>/;
# the numbers below only tune the delivery. See references/README.md for what to record.
#
# Accepted parameters (the same as ChatterboxMultilingualTTS.generate):
#   exaggeration  emotional intensity, 0.25 to 2.0 (0.5 = neutral)
#   cfg_weight    adherence to the reference's pacing; lower = looser and faster, 0 drops the inherited accent
#   temperature   variation between takes
# `by_category` overrides per line category (truco, six, nine, twelve, taunt, win, loss).
# `consent` records who the person in the reference recording is and that they authorized it;
# without it generate.py refuses to use the reference.
# `tts_overrides` changes the spoken text of a line for this character only (the original stays in the manifest).

characters:
  tiao:
    name: Tião
    gender: male
    description: Bar veteran. Mature, deep, slightly hoarse, countryside Goiás accent. Mocking and confident, shouts out of nowhere.
    reference: references/tiao/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pm_alex×0.6 + am_echo×0.4; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pm_alex: 0.6, am_echo: 0.4 }
      speed: 0.95
      text: "Ah, rapaz, senta aí que eu vou te ensinar a jogar truco. Faz trinta anos que eu jogo nesse boteco e nunca vi um parceiro tão ruim quanto você. Pode pedir, pode gritar, que eu não corro de ninguém não, sô."
    params: { exaggeration: 0.7, cfg_weight: 0.35, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 0.95, cfg_weight: 0.3 }
      six: { exaggeration: 0.95, cfg_weight: 0.3 }
      nine: { exaggeration: 1.0, cfg_weight: 0.3 }
      twelve: { exaggeration: 1.05, cfg_weight: 0.3 }
      taunt: { exaggeration: 0.6, cfg_weight: 0.4 }
    tts_overrides: {}

  juninho:
    name: Juninho
    gender: male
    description: Show-off. Young, high-pitched and fast. Taunts, laughs at opponents, overdoes the celebrations.
    reference: references/juninho/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pm_santa×0.6 + am_eric×0.4; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pm_santa: 0.6, am_eric: 0.4 }
      speed: 1.15
      text: "Aê, aê, olha a cara dele! Perdeu de novo, hein? Eu falei que hoje era meu dia! Pode chorar, pode chorar à vontade, que essa mão aqui é minha e ninguém tira. Bora, bora, joga logo essa carta!"
    params: { exaggeration: 0.85, cfg_weight: 0.3, temperature: 0.85 }
    by_category:
      six: { exaggeration: 1.1, cfg_weight: 0.25 }
      nine: { exaggeration: 1.1, cfg_weight: 0.25 }
      twelve: { exaggeration: 1.15, cfg_weight: 0.25 }
      win: { exaggeration: 1.15, cfg_weight: 0.25 }
    tts_overrides: {}

  ze:
    name: Zé
    gender: male
    description: Mocking country guy. Adult, medium or deep voice, drawling speech. Ironic and calm, taunts without shouting.
    reference: references/ze/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pm_santa×0.6 + bm_daniel×0.4; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pm_santa: 0.6, bm_daniel: 0.4 }
      speed: 0.85
      text: "Calma, gente, calma. Ninguém precisa ficar nervoso. Eu só tô sentado aqui, tomando minha cervejinha, olhando vocês perderem. Truco é assim mesmo, uma hora a gente ganha, outra hora vocês perdem."
    params: { exaggeration: 0.45, cfg_weight: 0.55, temperature: 0.75 }
    by_category:
      truco: { exaggeration: 0.65, cfg_weight: 0.45 }
      twelve: { exaggeration: 0.75, cfg_weight: 0.45 }
    tts_overrides: {}

  tonhao:
    name: Tonhão
    gender: male
    description: Explosive competitor. Deep, powerful, intense. Shouts when calling truco and gets outraged when he loses.
    reference: references/tonhao/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pm_santa×0.55 + am_onyx×0.45; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pm_santa: 0.55, am_onyx: 0.45 }
      speed: 1.0
      text: "Não, não, não! Isso aí é roubo! Eu tava com a manilha na mão e vocês vêm com essa? Pede truco de novo pra você ver! Eu quebro essa mesa, eu juro que quebro essa mesa no meio!"
    params: { exaggeration: 1.0, cfg_weight: 0.3, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 1.2, cfg_weight: 0.25 }
      six: { exaggeration: 1.2, cfg_weight: 0.25 }
      nine: { exaggeration: 1.2, cfg_weight: 0.25 }
      twelve: { exaggeration: 1.3, cfg_weight: 0.25 }
      loss: { exaggeration: 1.15, cfg_weight: 0.25 }
    tts_overrides: {}

  dona_cida:
    name: Dona Cida
    gender: female
    description: Truco veteran. Mature, firm, slightly hoarse, countryside Goiás accent. Alternates calm mockery with unexpected shouts.
    reference: references/dona_cida/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pf_dora×0.6 + af_kore×0.4; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pf_dora: 0.6, af_kore: 0.4 }
      speed: 0.95
      text: "Ai, meu filho, senta direito nessa cadeira. Eu jogo truco desde antes de você nascer, viu? Pode pedir o que quiser, que a véia aqui não tem medo de grito. Agora presta atenção e joga essa carta, anda."
    params: { exaggeration: 0.6, cfg_weight: 0.4, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 1.0, cfg_weight: 0.3 }
      six: { exaggeration: 1.0, cfg_weight: 0.3 }
      nine: { exaggeration: 1.0, cfg_weight: 0.3 }
      twelve: { exaggeration: 1.05, cfg_weight: 0.3 }
    tts_overrides: {}

  jessica:
    name: Jéssica
    gender: female
    description: Taunter. Young, expressive, energetic, talks fast. Sarcastic, laughs at opponents, shouts on raises.
    reference: references/jessica/reference.wav
    consent: "synthetic, no real person: Kokoro-82M (Apache-2.0), blend pf_dora×0.6 + bf_alice×0.4; provisional until there is an authorized recording"
    # Voice invented for the presentation (scripts/invent_reference.py). An authorized recording
    # replaces the reference; then this block and the consent above change.
    synthetic:
      blend: { pf_dora: 0.6, bf_alice: 0.4 }
      speed: 1.15
      text: "Gente, olha isso! Ele achou mesmo que ia ganhar de mim? Ai, que dó, que dó! Pode embaralhar de novo, amor, que eu vou te dar outra surra. Truco! Vai, corre, corre que eu tô vendo sua cara de medo!"
    params: { exaggeration: 0.85, cfg_weight: 0.3, temperature: 0.85 }
    by_category:
      six: { exaggeration: 1.15, cfg_weight: 0.25 }
      nine: { exaggeration: 1.15, cfg_weight: 0.25 }
      twelve: { exaggeration: 1.2, cfg_weight: 0.25 }
      taunt: { exaggeration: 0.8, cfg_weight: 0.3 }
    tts_overrides: {}
