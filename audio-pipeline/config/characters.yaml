# Elenco de vozes. A identidade vem da gravação de referência em references/<id>/;
# os números abaixo só ajustam a interpretação. Ver references/README.md para o que gravar.
#
# Parâmetros aceitos (os mesmos do ChatterboxMultilingualTTS.generate):
#   exaggeration  intensidade emocional, 0.25 a 2.0 (0.5 = neutro)
#   cfg_weight    aderência ao ritmo da referência; menor = mais solto e rápido, 0 tira o sotaque herdado
#   temperature   variação entre tomadas
# `by_category` sobrescreve por categoria de fala (truco, seis, nove, doze, provocacao, vitoria, derrota).
# `consent` registra quem é a pessoa da gravação de referência e que ela autorizou; sem isso o
# generate.py se recusa a usar a referência.
# `tts_overrides` troca o texto falado de uma linha só para este personagem (o original fica no manifesto).

characters:
  tiao:
    name: Tião
    gender: masculino
    description: Veterano do boteco. Maduro, grave, levemente rouco, sotaque do interior de Goiás. Debochado e confiante, grita do nada.
    reference: references/tiao/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pm_alex×0.6 + am_echo×0.4; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pm_alex: 0.6, am_echo: 0.4 }
      speed: 0.95
      text: "Ah, rapaz, senta aí que eu vou te ensinar a jogar truco. Faz trinta anos que eu jogo nesse boteco e nunca vi um parceiro tão ruim quanto você. Pode pedir, pode gritar, que eu não corro de ninguém não, sô."
    params: { exaggeration: 0.7, cfg_weight: 0.35, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 0.95, cfg_weight: 0.3 }
      seis: { exaggeration: 0.95, cfg_weight: 0.3 }
      nove: { exaggeration: 1.0, cfg_weight: 0.3 }
      doze: { exaggeration: 1.05, cfg_weight: 0.3 }
      provocacao: { exaggeration: 0.6, cfg_weight: 0.4 }
    tts_overrides: {}

  juninho:
    name: Juninho
    gender: masculino
    description: Fanfarrão. Jovem, agudo e acelerado. Provoca, ri dos adversários, exagera nas comemorações.
    reference: references/juninho/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pm_santa×0.6 + am_eric×0.4; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pm_santa: 0.6, am_eric: 0.4 }
      speed: 1.15
      text: "Aê, aê, olha a cara dele! Perdeu de novo, hein? Eu falei que hoje era meu dia! Pode chorar, pode chorar à vontade, que essa mão aqui é minha e ninguém tira. Bora, bora, joga logo essa carta!"
    params: { exaggeration: 0.85, cfg_weight: 0.3, temperature: 0.85 }
    by_category:
      seis: { exaggeration: 1.1, cfg_weight: 0.25 }
      nove: { exaggeration: 1.1, cfg_weight: 0.25 }
      doze: { exaggeration: 1.15, cfg_weight: 0.25 }
      vitoria: { exaggeration: 1.15, cfg_weight: 0.25 }
    tts_overrides: {}

  ze:
    name: Zé
    gender: masculino
    description: Caipira debochado. Adulto, voz média ou grave, fala arrastada. Irônico e tranquilo, provoca sem gritar.
    reference: references/ze/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pm_santa×0.6 + bm_daniel×0.4; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pm_santa: 0.6, bm_daniel: 0.4 }
      speed: 0.85
      text: "Calma, gente, calma. Ninguém precisa ficar nervoso. Eu só tô sentado aqui, tomando minha cervejinha, olhando vocês perderem. Truco é assim mesmo, uma hora a gente ganha, outra hora vocês perdem."
    params: { exaggeration: 0.45, cfg_weight: 0.55, temperature: 0.75 }
    by_category:
      truco: { exaggeration: 0.65, cfg_weight: 0.45 }
      doze: { exaggeration: 0.75, cfg_weight: 0.45 }
    tts_overrides: {}

  tonhao:
    name: Tonhão
    gender: masculino
    description: Competitivo explosivo. Grave, potente, intenso. Grita ao pedir truco e fica indignado quando perde.
    reference: references/tonhao/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pm_santa×0.55 + am_onyx×0.45; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pm_santa: 0.55, am_onyx: 0.45 }
      speed: 1.0
      text: "Não, não, não! Isso aí é roubo! Eu tava com a manilha na mão e vocês vêm com essa? Pede truco de novo pra você ver! Eu quebro essa mesa, eu juro que quebro essa mesa no meio!"
    params: { exaggeration: 1.0, cfg_weight: 0.3, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 1.2, cfg_weight: 0.25 }
      seis: { exaggeration: 1.2, cfg_weight: 0.25 }
      nove: { exaggeration: 1.2, cfg_weight: 0.25 }
      doze: { exaggeration: 1.3, cfg_weight: 0.25 }
      derrota: { exaggeration: 1.15, cfg_weight: 0.25 }
    tts_overrides: {}

  dona_cida:
    name: Dona Cida
    gender: feminino
    description: Veterana do truco. Madura, firme, levemente rouca, sotaque do interior de Goiás. Alterna deboche tranquilo com grito inesperado.
    reference: references/dona_cida/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pf_dora×0.6 + af_kore×0.4; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pf_dora: 0.6, af_kore: 0.4 }
      speed: 0.95
      text: "Ai, meu filho, senta direito nessa cadeira. Eu jogo truco desde antes de você nascer, viu? Pode pedir o que quiser, que a véia aqui não tem medo de grito. Agora presta atenção e joga essa carta, anda."
    params: { exaggeration: 0.6, cfg_weight: 0.4, temperature: 0.8 }
    by_category:
      truco: { exaggeration: 1.0, cfg_weight: 0.3 }
      seis: { exaggeration: 1.0, cfg_weight: 0.3 }
      nove: { exaggeration: 1.0, cfg_weight: 0.3 }
      doze: { exaggeration: 1.05, cfg_weight: 0.3 }
    tts_overrides: {}

  jessica:
    name: Jéssica
    gender: feminino
    description: Provocadora. Jovem, expressiva, enérgica, fala rápido. Sarcástica, ri dos adversários, grita nos aumentos.
    reference: references/jessica/reference.wav
    consent: "sintética, sem pessoa real: Kokoro-82M (Apache-2.0), mistura pf_dora×0.6 + bf_alice×0.4; provisória até haver gravação autorizada"
    # Voz inventada para a apresentação (scripts/invent_reference.py). Uma gravação autorizada
    # substitui a referência; aí este bloco e o consent acima mudam.
    synthetic:
      blend: { pf_dora: 0.6, bf_alice: 0.4 }
      speed: 1.15
      text: "Gente, olha isso! Ele achou mesmo que ia ganhar de mim? Ai, que dó, que dó! Pode embaralhar de novo, amor, que eu vou te dar outra surra. Truco! Vai, corre, corre que eu tô vendo sua cara de medo!"
    params: { exaggeration: 0.85, cfg_weight: 0.3, temperature: 0.85 }
    by_category:
      seis: { exaggeration: 1.15, cfg_weight: 0.25 }
      nove: { exaggeration: 1.15, cfg_weight: 0.25 }
      doze: { exaggeration: 1.2, cfg_weight: 0.25 }
      provocacao: { exaggeration: 0.8, cfg_weight: 0.3 }
    tts_overrides: {}
