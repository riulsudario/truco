# Model and shared generation parameters.

model:
  # pt-br: "Chatterbox Multilingual V3 Single Language Pack" finetune for Brazilian Portuguese (MIT).
  # v3: general V3 multilingual checkpoint, for comparison.
  variant: pt-br
  language_id: pt
  device: cuda

# generate() defaults when neither the character nor the category says otherwise.
defaults:
  exaggeration: 0.5
  cfg_weight: 0.5
  temperature: 0.8
  repetition_penalty: 1.2
  min_p: 0.05
  top_p: 1.0

# Chatterbox's generate() takes no seed: the script seeds torch/numpy/random before each take
# with a seed derived from (base_seed, character, line, variant), so the same take comes out the same.
base_seed: 1977
variants: 3

# Phase B: deliveries. Each style replaces the character's parameters.
styles:
  normal: { exaggeration: 0.5, cfg_weight: 0.5, temperature: 0.8 }
  mockery: { exaggeration: 0.65, cfg_weight: 0.45, temperature: 0.85 }
  taunt: { exaggeration: 0.8, cfg_weight: 0.35, temperature: 0.85 }
  shout: { exaggeration: 1.2, cfg_weight: 0.25, temperature: 0.8 }
  outrage: { exaggeration: 1.0, cfg_weight: 0.3, temperature: 0.9 }

phases:
  A:
    lines: [six_001]
  B:
    lines: [truco_001, six_001, taunt_001, win_003, loss_002]
    styles: [normal, mockery, taunt, shout, outrage]

# Processing (process_audio.py) and export (export.py).
processing:
  trim_threshold_db: -45      # below this counts as edge silence
  keep_silence_ms: 60         # breathing room kept before and after the line
  loudness_lufs: -16          # integrated loudness target
  true_peak_db: -1.5          # ceiling to avoid clipping
  compress: true              # light compression before normalization

export:
  opus_bitrate: 48k
  mp3_quality: 5              # LAME VBR, ~130 kbps mono; enough for voice
  sample_rate: 48000

validation:
  min_duration_s: 0.4
  max_duration_s: 8.0
  max_edge_silence_s: 0.35    # in processed files
  clip_ratio: 0.001           # fraction of samples at the ceiling that counts as clipping
